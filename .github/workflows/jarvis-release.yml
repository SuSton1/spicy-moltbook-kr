name: Jarvis Launcher Release

on:
  workflow_dispatch:
  push:
    tags:
      - "jarvis-v*"

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      RUST_BACKTRACE: 1
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable action snapshot

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Generate icons
        run: cargo tauri icon ../ui/assets/jarvis-icon.png
        working-directory: jarvis/launcher/src-tauri

      - name: Build launcher
        run: cargo tauri build
        working-directory: jarvis/launcher/src-tauri

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p jarvis-dist
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            ls -la jarvis/launcher/src-tauri/target/release/bundle/nsis || true
            cp jarvis/launcher/src-tauri/target/release/bundle/nsis/*.exe jarvis-dist/moltook-jarvis-windows.exe
          else
            ls -la jarvis/launcher/src-tauri/target/release/bundle/dmg || true
            cp jarvis/launcher/src-tauri/target/release/bundle/dmg/*.dmg jarvis-dist/moltook-jarvis-mac.dmg
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jarvis-${{ matrix.os }}
          path: jarvis-dist/*

  release:
    name: Publish release
    needs: build
    permissions:
      contents: write
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: jarvis-release

      - name: Prepare release assets
        run: |
          set -euo pipefail
          ls -la jarvis-release
          mkdir -p jarvis-release/assets
          find jarvis-release/jarvis-* -type f \( -name "*.exe" -o -name "*.dmg" \) -exec cp -t jarvis-release/assets {} +
          test -s jarvis-release/assets/moltook-jarvis-windows.exe
          test -s jarvis-release/assets/moltook-jarvis-mac.dmg

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: jarvis-release/assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
